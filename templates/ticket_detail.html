{% extends "base.html" %}

{% block title %}Ticket {{ number }}{% endblock %}

{% block content %}

<h1>Ticket {{ number }}</h1>
<h2>{{ ticket.title }}</h2>


<p><strong>Ticket number:</strong> {{ number }}</p>
<p><strong>Reporter:</strong> {{ ticket.reporter }}</p>
<p><strong>Priority:</strong> {{ ticket.priority }}</p>
<p><strong>Status:</strong> {{ ticket.status }}</p>

<p>
    <a href="{{ url_for('tickets') }}">Back to all tickets</a>
</p>

{% endblock %}
